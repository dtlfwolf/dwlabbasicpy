version: 1
disable_existing_loggers: False
formatters:
  simple:
    (): dwlabbasicpy.DwlabLogFormatter
  detailed:
    (): dwlabbasicpy.DwlabLogFormatter

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: detailed
    stream: ext://sys.stdout

  syslog:
    class: logging.handlers.SysLogHandler
    level: INFO
    formatter: detailed
    address: "/dev/log"

loggers:
  dwlabbasicpy.dwlabLogger:
    level: INFO
    handlers: [console, syslog]
    propagate: no
  dwlabbasicpy.dwlabSettings:
    level: INFO
    handlers: [console, syslog]
    propagate: no
  dwlabbasicpy.dwlabRuntimeEnvironment:
    level: INFO
    handlers: [console, syslog]
    propagate: no
  dwlabbasicpy.dwlabSetup:
    level: INFO
    handlers: [console, syslog]
    propagate: no
  dwlabbasicpy.dwlabObjectHandler:
    level: INFO
    handlers: [console, syslog]
    propagate: no

root:
  level: INFO
  handlers: [console, syslog]
